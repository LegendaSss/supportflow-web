image: docker:24-cli

stages:
  - validate
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  COMPOSE_PROJECT_NAME: supportflow-web
  DEPLOY_DIR: /root/app
  # Timeweb server connection
  DEPLOY_HOST: "93.183.83.53"
  DEPLOY_USER: "root"

# ---------------------------------------------------------------------------
# Stage: validate (dev only)
# ---------------------------------------------------------------------------
validate:dev:
  stage: validate
  tags: [dockfather, hetzner, cloverit, infra]
  script:
    - echo "Checking required CI/CD variables for dev..."
    - |
      MISSING=""
      for VAR in TELEGRAM_BOT_TOKEN REMNAWAVE_URL REMNAWAVE_API_KEY POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DEPLOY_SSH_KEY; do
        eval "VAL=\$$VAR"
        if [ -z "$VAL" ]; then
          MISSING="$MISSING $VAR"
        fi
      done
      if [ -n "$MISSING" ]; then
        echo "ERROR: Missing required CI/CD variables for dev:$MISSING"
        exit 1
      fi
    - echo "All required dev variables present."
  environment:
    name: dev
    deployment_tier: development
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# Stage: deploy (dev only) — via SSH to Timeweb server
# ---------------------------------------------------------------------------
deploy:dev:
  stage: deploy
  tags: [dockfather, hetzner, cloverit, infra]
  before_script:
    # Setup SSH access to Timeweb server
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # --- Generate .env ---
    - |
      echo "Generating .env..."
      cat > /tmp/.env << EOF
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      POSTGRES_DB=${POSTGRES_DB}
      DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      VPN_BOT_TOKEN=${VPN_BOT_TOKEN:-}
      REMNAWAVE_URL=${REMNAWAVE_URL}
      REMNAWAVE_PUBLIC_URL=${REMNAWAVE_PUBLIC_URL:-${REMNAWAVE_URL}}
      REMNAWAVE_API_KEY=${REMNAWAVE_API_KEY}
      JWT_SECRET=${JWT_SECRET:-supportflow-unlok-secret-2026}
      EOF
      echo ".env generated."

    # --- Upload files to server ---
    - |
      echo "Uploading files to ${DEPLOY_HOST}..."
      scp /tmp/.env ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/.env
      rsync -avz --delete \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='.next' \
        --exclude='.env' \
        --exclude='.env.*' \
        -e ssh \
        ./ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/web/
      echo "Files uploaded."

    # --- Build & deploy on remote server ---
    - |
      echo "Building and deploying on server..."
      ssh ${DEPLOY_USER}@${DEPLOY_HOST} << 'REMOTE_SCRIPT'
        cd /root/app
        docker-compose build web
        docker-compose up -d --remove-orphans
        echo "=== Container status ==="
        docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      REMOTE_SCRIPT

    # --- Health check ---
    - |
      echo "Waiting for web to become healthy..."
      TRIES=0
      MAX_TRIES=15
      while [ $TRIES -lt $MAX_TRIES ]; do
        if ssh ${DEPLOY_USER}@${DEPLOY_HOST} "curl -s -o /dev/null -w '%{http_code}' http://localhost:3000" | grep -qE "200|301|302"; then
          echo "Web is up and responding!"
          break
        fi
        TRIES=$((TRIES + 1))
        echo "  Attempt $TRIES/$MAX_TRIES..."
        sleep 5
      done
      if [ $TRIES -ge $MAX_TRIES ]; then
        echo "WARNING: Web did not respond within timeout. Check logs:"
        ssh ${DEPLOY_USER}@${DEPLOY_HOST} "cd /root/app && docker-compose logs --tail=30 web"
        exit 1
      fi

    - echo "Dev deployment complete!"
  environment:
    name: dev
    url: http://93.183.83.53:3000
    deployment_tier: development
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ---------------------------------------------------------------------------
# Rollback (manual)
# ---------------------------------------------------------------------------
rollback:dev:
  stage: deploy
  tags: [dockfather, hetzner, cloverit, infra]
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh ${DEPLOY_USER}@${DEPLOY_HOST} "cd /root/app && docker-compose down && docker-compose up -d"
  environment:
    name: dev
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
  allow_failure: true
